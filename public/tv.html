<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JJS Timer — TV</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --col-bg:      #0c0c0c;
      --col-text:    #ffffff;
      --col-dim:     #4a4a4a;
      --col-muted:   #1e1e1e;
      --col-work:    #C8102E;
      --col-rest:    #888888;
      --col-warning: #E8600A;
      --col-finish:  #C8102E;
    }

    html, body {
      width: 100%; height: 100vh;
      background: var(--col-bg);
      color: var(--col-text);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      scrollbar-width: none;
    }
    ::-webkit-scrollbar { display: none; }

    /* ── Centrage absolu du timer ─────── */
    #center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    /* ── Timer ────────────────────────── */
    #timer {
      font-size: 35vw;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: 0.88;
      letter-spacing: -0.03em;
      color: var(--col-text);
      transition: color 0.4s;
      will-change: transform, color;
      text-align: center;
    }

    /* ── Phase label — sous le timer ──── */
    #phase-label {
      font-size: clamp(18px, 3.5vw, 52px);
      font-weight: 700;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--col-work);
      min-height: 1.1em;
      margin-top: 1.5vh;
      transition: color 0.4s;
    }

    /* ── Round dots ───────────────────── */
    #round-dots {
      display: flex;
      gap: clamp(8px, 1.4vw, 22px);
      margin-top: 2vh;
      min-height: clamp(12px, 1.8vw, 26px);
    }
    .dot {
      width: clamp(12px, 1.6vw, 24px);
      height: clamp(12px, 1.6vw, 24px);
      border-radius: 50%;
      background: var(--col-muted);
      transition: background 0.3s;
    }
    .dot.done    { background: #2a2a2a; }
    .dot.current { background: var(--col-work); }
    .dot.current.rest-dot { background: var(--col-rest); }

    /* ── Logo — coin supérieur gauche ──── */
    #logo-wrap {
      position: absolute;
      top: 3vh;
      left: 0; right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6vh;
      pointer-events: none;
    }
    #gym-logo {
      height: clamp(70px, 12vh, 150px);
      width: auto;
      filter: invert(1) hue-rotate(180deg);
      opacity: 0.90;
    }
    #gym-name {
      font-size: clamp(12px, 1.6vw, 26px);
      font-weight: 300;
      letter-spacing: 0.55em;
      text-transform: uppercase;
      color: var(--col-dim);
    }

    /* ── Mode label ───────────────────── */
    #mode-label {
      position: absolute;
      top: 3vh;
      right: 3vw;
      font-size: clamp(10px, 1vw, 15px);
      font-weight: 500;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #2e2e2e;
    }

    /* ── Round info ───────────────────── */
    #round-info {
      position: absolute;
      top: 3vh;
      left: 3vw;
      font-size: clamp(12px, 1.6vw, 26px);
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--col-dim);
    }

    /* ── Status bar ───────────────────── */
    #status-bar {
      position: absolute;
      bottom: 3vh;
      left: 0; right: 0;
      text-align: center;
      font-size: clamp(12px, 1.4vw, 22px);
      letter-spacing: 0.45em;
      color: var(--col-dim);
      text-transform: uppercase;
    }

    /* ── Barre rouge bas ─────────────── */
    #accent-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 5px;
      background: var(--col-work);
      opacity: 0.6;
    }

    /* ── Overlay son ─────────────────── */
    #sound-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.90);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3vh;
      z-index: 99;
      cursor: pointer;
    }
    #sound-overlay.hidden { display: none; }
    #sound-overlay .so-hint  { font-size: clamp(14px, 2vw, 28px); letter-spacing: 0.35em; color: #555; }
    #sound-overlay .so-cta   { font-size: clamp(28px, 5vw, 72px); font-weight: 900; letter-spacing: 0.3em; color: var(--col-work); }
    #sound-overlay .so-small { font-size: clamp(11px, 1.2vw, 18px); color: #333; letter-spacing: 0.3em; }

    /* ── Overlay 3-2-1 ───────────────── */
    #countdown-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10,10,10,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    #countdown-overlay.hidden { display: none; }
    #countdown-number {
      font-size: 45vw;
      font-weight: 900;
      color: #fff;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: -0.04em;
    }
    #countdown-number.go {
      font-size: clamp(60px, 16vw, 240px);
      color: var(--col-work);
      letter-spacing: 0.08em;
    }
    @keyframes pop-in {
      0%   { transform: scale(1.5); opacity: 0; }
      60%  { transform: scale(0.93); opacity: 1; }
      100% { transform: scale(1);   opacity: 1; }
    }
    .pop { animation: pop-in 0.3s cubic-bezier(0.22,1,0.36,1) both; }

    /* ══ États ══════════════════════════════════════════════ */
    body.phase-rest #phase-label { color: var(--col-rest); }
    body.phase-rest #timer       { color: #b0b0b0; }

    body.warning #timer        { color: var(--col-warning); }
    body.warning #phase-label  { color: var(--col-warning); }
    @keyframes pulse-warn {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.02); }
    }
    body.warning #timer { animation: pulse-warn 0.45s ease-in-out infinite; }

    body.paused #timer      { opacity: 0.38; }
    body.paused #status-bar { color: var(--col-warning); }

    body.finished #timer       { color: var(--col-finish); }
    body.finished #phase-label { color: var(--col-finish); }
    @keyframes flash-done {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.15; }
    }
    body.finished #timer { animation: flash-done 0.9s ease-in-out infinite; }
  </style>
</head>
<body>

  <!-- Vidéo anti-veille (fallback pour navigateurs TV sans Wake Lock API) -->
  <video id="keep-awake-video" muted playsinline loop
         style="position:fixed; width:1px; height:1px; opacity:0.01; pointer-events:none; left:0; bottom:0; z-index:-1;"></video>

  <!-- Overlay son -->
  <div id="sound-overlay">
    <div class="so-hint">APPUYER POUR ACTIVER</div>
    <div class="so-cta">▶ OK</div>
    <div class="so-small">TÉLÉCOMMANDE OU CLIC</div>
  </div>

  <!-- Overlay 3-2-1 -->
  <div id="countdown-overlay" class="hidden">
    <div id="countdown-number">3</div>
  </div>

  <!-- Logo -->
  <div id="logo-wrap">
    <img id="gym-logo" src="/logo.png" alt="Jiu-Jitsu Saguenay"
         onerror="this.style.display='none'">
    <div id="gym-name">JIU-JITSU SAGUENAY</div>
  </div>

  <!-- Mode (coin droit) -->
  <div id="mode-label"></div>

  <!-- Round (coin gauche) -->
  <div id="round-info"></div>

  <!-- Centre absolu : timer + phase + dots -->
  <div id="center">
    <div id="timer">—:——</div>
    <div id="phase-label"></div>
    <div id="round-dots"></div>
  </div>

  <!-- Status bas -->
  <div id="status-bar">EN ATTENTE</div>
  <div id="accent-bar"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ── Audio (HTML5 — compatible Fire Stick Silk) ─────────────────────
    const SND = {};
    ['tick','go','resumed','phase-rest','phase-work','warn','finish'].forEach(name => {
      const a = new Audio('/sounds/' + name + '.wav');
      a.preload = 'auto';
      SND[name] = a;
    });

    let audioUnlocked = false;

    // ── Anti-veille écran (Wake Lock + fallback vidéo) ─────────────────
    // Empêche la TV / le Chromecast de mettre l'écran en veille pendant un cours.
    // 1) Screen Wake Lock API : fiable, fonctionne car Railway sert en HTTPS.
    // 2) Fallback vidéo muette en boucle : filet de sécurité pour les
    //    navigateurs de TV plus anciens qui ignorent l'API Wake Lock.
    let wakeLock = null;
    let keepAwakeStarted = false;

    const KEEP_AWAKE_MP4  = 'data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAM5bW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAAA+gAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAmN0cmFrAAAAXHRraGQAAAADAAAAAAAAAAAAAAABAAAAAAAAA+gAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAIAAAABIAAAAAAAkZWR0cwAAABxlbHN0AAAAAAAAAAEAAAPoAAAAAAABAAAAAAHbbWRpYQAAACBtZGhkAAAAAAAAAAAAAAAAAAAoAAAAKABVxAAAAAAALWhkbHIAAAAAAAAAAHZpZGUAAAAAAAAAAAAAAABWaWRlb0hhbmRsZXIAAAABhm1pbmYAAAAUdm1oZAAAAAEAAAAAAAAAAAAAACRkaW5mAAAAHGRyZWYAAAAAAAAAAQAAAAx1cmwgAAAAAQAAAUZzdGJsAAAAunN0c2QAAAAAAAAAAQAAAKphdmMxAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAIAASABIAAAASAAAAAAAAAABFUxhdmM2MC4zMS4xMDIgbGlieDI2NAAAAAAAAAAAAAAAGP//AAAAMGF2Y0MBQsAK/+EAGGdCwArZAgv5cBEAAAMAAQAAAwAKDxImSAEABWjLg8sgAAAAEHBhc3AAAAABAAAAAQAAABRidHJ0AAAAAAAAFmAAABZgAAAAGHN0dHMAAAAAAAAAAQAAAAUAAAgAAAAAFHN0c3MAAAAAAAAAAQAAAAEAAAAcc3RzYwAAAAAAAAABAAAAAQAAAAUAAAABAAAAKHN0c3oAAAAAAAAAAAAAAAUAAAKiAAAACwAAAAsAAAAKAAAACgAAABRzdGNvAAAAAAAAAAEAAANpAAAAYnVkdGEAAABabWV0YQAAAAAAAAAhaGRscgAAAAAAAAAAbWRpcmFwcGwAAAAAAAAAAAAAAAAtaWxzdAAAACWpdG9vAAAAHWRhdGEAAAABAAAAAExhdmY2MC4xNi4xMDAAAAAIZnJlZQAAAtRtZGF0AAACcAYF//9s3EXpvebZSLeWLNgg2SPu73gyNjQgLSBjb3JlIDE2NCByMzEwOCAzMWUxOWY5IC0gSC4yNjQvTVBFRy00IEFWQyBjb2RlYyAtIENvcHlsZWZ0IDIwMDMtMjAyMyAtIGh0dHA6Ly93d3cudmlkZW9sYW4ub3JnL3gyNjQuaHRtbCAtIG9wdGlvbnM6IGNhYmFjPTAgcmVmPTMgZGVibG9jaz0xOjA6MCBhbmFseXNlPTB4MToweDExMSBtZT1oZXggc3VibWU9NyBwc3k9MSBwc3lfcmQ9MS4wMDowLjAwIG1peGVkX3JlZj0xIG1lX3JhbmdlPTE2IGNocm9tYV9tZT0xIHRyZWxsaXM9MSA4eDhkY3Q9MCBjcW09MCBkZWFkem9uZT0yMSwxMSBmYXN0X3Bza2lwPTEgY2hyb21hX3FwX29mZnNldD0tMiB0aHJlYWRzPTIgbG9va2FoZWFkX3RocmVhZHM9MSBzbGljZWRfdGhyZWFkcz0wIG5yPTAgZGVjaW1hdGU9MSBpbnRlcmxhY2VkPTAgYmx1cmF5X2NvbXBhdD0wIGNvbnN0cmFpbmVkX2ludHJhPTAgYmZyYW1lcz0wIHdlaWdodHA9MCBrZXlpbnQ9MjUwIGtleWludF9taW49NSBzY2VuZWN1dD00MCBpbnRyYV9yZWZyZXNoPTAgcmNfbG9va2FoZWFkPTQwIHJjPWNyZiBtYnRyZWU9MSBjcmY9MjMuMCBxY29tcD0wLjYwIHFwbWluPTAgcXBtYXg9NjkgcXBzdGVwPTQgaXBfcmF0aW89MS40MCBhcT0xOjEuMDAAgAAAACpliIQEfJigADYjJycnJycnJ111111111111111111111111111111114AAAAAHQZo4CPgpgAAAAAdBmlQCPgpgAAAABkGaYBDwUwAAAAZBmoA/wUw==';
    const KEEP_AWAKE_WEBM = 'data:video/webm;base64,GkXfo59ChoEBQveBAULygQRC84EIQoKEd2VibUKHgQJChYECGFOAZwEAAAAAAAJCEU2bdLpNu4tTq4QVSalmU6yBoU27i1OrhBZUrmtTrIHYTbuMU6uEElTDZ1OsggEeTbuMU6uEHFO7a1OsggIs7AEAAAAAAABZAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAVSalmsirXsYMPQkBNgI1MYXZmNjAuMTYuMTAwV0GNTGF2ZjYwLjE2LjEwMESJiECPQAAAAAAAFlSua8GuAQAAAAAAADjXgQFzxYgaurIuAx8Xe5yBACK1nIN1bmSIgQCGhVZfVlA5g4EBI+ODhAvrwgDgibCBgLqBSJqBAhJUw2dAgHNzoGPAgGfImkWjh0VOQ09ERVJEh41MYXZmNjAuMTYuMTAwc3PaY8CLY8WIGrqyLgMfF3tnyKVFo4dFTkNPREVSRIeYTGF2YzYwLjMxLjEwMiBsaWJ2cHgtdnA5Z8ihRaOIRFVSQVRJT05Eh5MwMDowMDowMS4wMDAwMDAwMDAAH0O2dUCC54EAo6WBAACAgkmDQgAH8AR2ADgkHBhCAAAwYAAAZz///1mvETu4KQsAo5SBAMgAhgBAkpwASUAAAyAAAFj/WqOUgQGQAIYAQJKcAErAAAMgAABY/1qjlIECWACGAECSnABJwAADIAAAWP9ao5SBAyAAhgBAkpwASKAAAyAAAFj/WhxTu2uRu4+zgQC3iveBAfGCAaTwgQM=';

    async function requestWakeLock() {
      if (!('wakeLock' in navigator)) return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } catch (e) { /* non supporté ou refusé — le fallback vidéo prend le relais */ }
    }

    function startKeepAwakeVideo() {
      const v = document.getElementById('keep-awake-video');
      if (!v) return;
      if (!v.src) {
        const canWebm = v.canPlayType && v.canPlayType('video/webm') !== '';
        v.src = canWebm ? KEEP_AWAKE_WEBM : KEEP_AWAKE_MP4;
      }
      const p = v.play();
      if (p && p.catch) p.catch(() => {});
    }

    function keepScreenAwake() {
      keepAwakeStarted = true;
      requestWakeLock();
      startKeepAwakeVideo();
    }

    // Ré-acquérir le verrou quand l'onglet redevient visible
    // (le Wake Lock est automatiquement libéré si l'écran passe en arrière-plan).
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && keepAwakeStarted) {
        requestWakeLock();
        startKeepAwakeVideo();
      }
    });

    function requestFullscreen() {
      const el = document.documentElement;
      const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
      if (fn) fn.call(el).catch(() => {});
    }

    function unlockAudio() {
      // L'anti-veille se déclenche au premier geste, indépendamment du son :
      // garder l'écran allumé ne doit jamais dépendre du succès de l'audio.
      if (!keepAwakeStarted) keepScreenAwake();
      if (audioUnlocked) return;
      const attempt = SND['tick'].play();
      if (attempt !== undefined) {
        attempt.then(() => {
          audioUnlocked = true;
          document.getElementById('sound-overlay').classList.add('hidden');
          requestFullscreen();
        }).catch(() => {});
      } else {
        audioUnlocked = true;
        document.getElementById('sound-overlay').classList.add('hidden');
        requestFullscreen();
      }
    }

    // Tenter à chaque interaction utilisateur
    ['click', 'touchstart', 'keydown', 'pointerdown'].forEach(evt => {
      document.addEventListener(evt, unlockAudio);
    });

    function playSound(name) {
      if (!audioUnlocked || !SND[name]) return;
      SND[name].currentTime = 0;
      SND[name].play().catch(() => {});
    }

    function playGo()                { playSound('go'); }

    function playEvent(event, phase) {
      switch(event) {
        case 'resumed':     playSound('resumed');                                        break;
        case 'phase_change': playSound(phase === 'rest' ? 'phase-rest' : 'phase-work'); break;
        case 'finished':    playSound('finish');                                         break;
      }
    }

    // ── Éléments DOM ──────────────────────────────────────────────────
    const timerEl     = document.getElementById('timer');
    const phaseEl     = document.getElementById('phase-label');
    const modeLabelEl = document.getElementById('mode-label');
    const roundEl     = document.getElementById('round-info');
    const dotsEl      = document.getElementById('round-dots');
    const statusEl    = document.getElementById('status-bar');
    const cdOverlay   = document.getElementById('countdown-overlay');
    const cdNumEl     = document.getElementById('countdown-number');
    const body        = document.body;

    function fmt(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${m}:${String(sec).padStart(2,'0')}`;
    }

    const PHASE_LABELS = {
      countdown: { work: '' },
      hiit:      { work: 'TRAVAIL', rest: 'REPOS' },
      grappling: { work: 'ROUND',   rest: 'REPOS' }
    };

    const MODE_LABELS = {
      countdown: 'COMPTE À REBOURS',
      hiit:      'INTERVALLES HIIT',
      grappling: 'GRAPPLING TIMER'
    };

    let lastEventSeq = -1;
    let lastStatus   = '';
    let goTimeout    = null;

    function triggerPop() {
      cdNumEl.classList.remove('pop');
      void cdNumEl.offsetWidth;
      cdNumEl.classList.add('pop');
    }

    const socket = io();

    socket.on('state', (s) => {

      // ── Compte à rebours 3-2-1 ──────────────────────────────────────
      if (s.status === 'countdown') {
        cdOverlay.classList.remove('hidden');
        cdNumEl.className = 'pop';
        cdNumEl.textContent = s.countdownRemaining;
        triggerPop();
        playSound('tick');
        lastStatus = 'countdown';
        return;
      }

      // ── PARTEZ ! ─────────────────────────────────────────────────────
      if (s.event === 'started' && lastStatus === 'countdown') {
        cdOverlay.classList.remove('hidden');
        cdNumEl.className = 'go pop';
        cdNumEl.textContent = 'PARTEZ !';
        triggerPop();
        playGo();
        clearTimeout(goTimeout);
        goTimeout = setTimeout(() => cdOverlay.classList.add('hidden'), 750);
      } else if (lastStatus !== 'countdown') {
        cdOverlay.classList.add('hidden');
      }

      lastStatus = s.status;

      // ── Sons ─────────────────────────────────────────────────────────
      const isNewEvent = s.eventSeq !== lastEventSeq;
      lastEventSeq = s.eventSeq;

      if (isNewEvent && s.event) {
        if (s.event === 'warning') {
          playSound('warn');
        } else if (s.event !== 'countdown_tick') {
          playEvent(s.event, s.phase);
        }
      }

      // ── Affichage ─────────────────────────────────────────────────
      timerEl.textContent = s.status === 'idle' ? '—:——' : fmt(s.phaseRemaining);

      const labels = PHASE_LABELS[s.mode] || {};
      phaseEl.textContent = s.status === 'idle' ? '' : (labels[s.phase] || '');

      modeLabelEl.textContent = s.status === 'idle' ? (MODE_LABELS[s.mode] || '') : '';

      if (s.mode !== 'countdown' && s.status !== 'idle') {
        roundEl.textContent = `ROUND ${s.currentRound} / ${s.totalRounds}`;
      } else {
        roundEl.textContent = '';
      }

      const statusMap = {
        idle:     'EN ATTENTE',
        running:  '',
        paused:   '⏸  PAUSE',
        finished: '✓  TERMINÉ'
      };
      statusEl.textContent = statusMap[s.status] ?? '';

      body.className = '';
      if (s.status === 'paused')   body.classList.add('paused');
      if (s.status === 'finished') body.classList.add('finished');
      if (s.phase === 'rest' && s.status === 'running')
        body.classList.add('phase-rest');
      if (s.status === 'running' && s.phaseRemaining <= 10 && s.phaseRemaining > 0)
        body.classList.add('warning');

      dotsEl.innerHTML = '';
      if (s.totalRounds > 1 && s.mode !== 'countdown') {
        for (let i = 1; i <= s.totalRounds; i++) {
          const d = document.createElement('div');
          d.className = 'dot';
          if (i < s.currentRound)        d.classList.add('done');
          else if (i === s.currentRound) {
            d.classList.add('current');
            if (s.phase === 'rest') d.classList.add('rest-dot');
          }
          dotsEl.appendChild(d);
        }
      }
    });

    // ── Télécommande Fire Stick ────────────────────────────────────────
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ' || e.keyCode === 13) {
        socket.emit('command', { action: 'toggle' });
        e.preventDefault();
      } else if (e.key === 'Backspace' || e.key === 'Escape' || e.keyCode === 8) {
        socket.emit('command', { action: 'reset' });
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
